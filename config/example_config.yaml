# KIR-BLOOM Example Configuration
# This is a concrete example showing how to set up KIR-BLOOM
# with a typical directory structure
#
# Recommended directory layout:
#   project_root/
#   ├── config/
#   │   └── example_config.yaml (this file)
#   ├── resources/              (all reference files here)
#   ├── data/                   (your FASTQ/BAM/CRAM files)
#   └── output/                 (results will be here)

Reference:
  # Path to your reference genome
  # IMPORTANT: Must include HLA and decoy sequences
  # For GRCh38, download: GRCh38_full_analysis_set_plus_decoy_hla.fa
  fasta: "./resources/GRCh38_full_analysis_set_plus_decoy_hla.fa"

  # KIR regions BED file (optional)
  # If set to null, will be auto-generated from reference
  # Leave as null unless you have a pre-made KIR regions file
  KIR_regions_bed: null

  # KIR-specific reference sequences
  # These should be in your resources/ directory
  fasta_2: "./resources/kir_reference_2025/ref_with_utr_extended.fa"

  # KIR allele database
  KIR_alleles: "./resources/kir_reference_2025/kir_gen_new_mod_with_utr_extended.fasta"

  # KIR allele position mapping (BED format)
  KIR_alleles_bed: "./resources/kir_reference_2025/kir_allele_names_new_kir_only.bed"

  # Annotation files (BED format)
  exon_bed: "./resources/kir_reference_2025/annotations_mod_with_utr_extended_exon.bed"
  intron_bed: "./resources/kir_reference_2025/annotations_mod_with_utr_extended_intron.bed"
  utr_bed: "./resources/kir_reference_2025/annotations_mod_with_utr_extended_utr.bed"

  # Multiple sequence alignment data
  # Directory containing pre-computed alignments for all KIR alleles
  msa_path: "./resources/kir_reference_2025/msa_after_utr_extension"

  # MSA mapping information
  msa_mappings_path: "./resources/kir_reference_2025/msa_after_utr_extension/msa_mappings"

  # Allele metadata
  Allele_list: "./resources/kir_reference_2025/Allelelist.txt"

  # Allele representatives (pickle file containing representative sequences)
  rep: "./resources/kir_reference_2025/allele_representatives_new_kir.pkl"

Samples:
  # Output directory where results will be saved
  samples_dir: "./output"

  # Method 1: Specify samples directly (for small numbers of samples)
  # Format: "sample_name": ["path/to/read1.fastq.gz", "path/to/read2.fastq.gz"]
  sample_fastqs:
    "sample_1": ["./data/sample_1_R1.fastq.gz", "./data/sample_1_R2.fastq.gz"]
    "sample_2": ["./data/sample_2_R1.fastq.gz", "./data/sample_2_R2.fastq.gz"]
    "sample_3": ["./data/sample_3_R1.fastq.gz", "./data/sample_3_R2.fastq.gz"]

  # Method 2: Use CSV file (uncomment below for large batch processing)
  # Uncomment the line below if you have many samples and want to use CSV
  # Remove the sample_fastqs section above when using CSV
  # sample_csv: "./samples.csv"

# External tools - provide full paths if not in PATH
# Get these from the tool websites or package managers
bwa_path: null          # Set to: "/path/to/bwa-mem2" if not in PATH
immuannot: null         # Set to: "/path/to/immuannot.sh" if not in PATH

# Optional parameters
parameters:
  threads: 4            # Number of CPU threads to use
  memory_gb: 16         # Memory limit in GB

